# Easy Home WAF — placeholder until the first successful Apply from easy-waf-api.
# Replaced entirely by the rendered config. Must pass `haproxy -c` on HAProxy 3.x.
global
	log stdout format raw local0
	maxconn 1000
	stats socket __EASY_WAF_STATE__/haproxy/admin.sock mode 660 level admin
	stats timeout 30s

defaults
	mode	http
	timeout connect 5s
	timeout client	10s
	timeout server	10s

frontend fe_bootstrap
	bind *:80
	mode http
	default_backend bk_bootstrap_wait

backend bk_bootstrap_wait
	mode http
	http-request deny deny_status 503
