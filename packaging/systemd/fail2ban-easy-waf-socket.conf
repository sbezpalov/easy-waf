# LEGACY — not installed by install.sh. Fail2ban API access uses easy-waf-hostd (root broker).
# Easy Home WAF — allow fail2ban group to use fail2ban-client without root/sudo.
# easy-waf-api.service sets NoNewPrivileges=true, so sudo cannot elevate privileges.
[Service]
ExecStartPost=-/bin/sh -c 'for d in /var/run/fail2ban /run/fail2ban; do [ -d "$d" ] && chgrp fail2ban "$d" 2>/dev/null && chmod 710 "$d"; done; for s in /var/run/fail2ban/fail2ban.sock /run/fail2ban/fail2ban.sock; do [ -S "$s" ] && chgrp fail2ban "$s" && chmod 660 "$s"; done; true'
