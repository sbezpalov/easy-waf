# Installed to /etc/systemd/system/haproxy.service.d/50-easy-waf.conf by scripts/install.sh
# (or scripts/fix-haproxy-easy-waf-dropin.sh). __EASY_WAF_STATE__ is replaced with the real state path.
[Service]
# Stock Alma/RHEL unit loads /etc/haproxy/haproxy.cfg plus conf.d — ignore that and use only the API-rendered file.
ExecStart=
ExecStartPre=
ExecReload=
# Config check: no -q (treats warnings as failure on some 3.0.x builds) and no $OPTIONS
# (sysconfig may pass flags meant for runtime, not for -c).
ExecStartPre=/usr/sbin/haproxy -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -c
ExecStart=/usr/sbin/haproxy -Ws -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -p /run/haproxy.pid $OPTIONS
ExecReload=/usr/sbin/haproxy -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -c
ExecReload=/bin/kill -USR2 $MAINPID
