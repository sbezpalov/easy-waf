# Reference drop-in (legacy name 50-easy-waf.conf). Prefer scripts/fix-haproxy-easy-waf-dropin.sh
# which writes haproxy.service.d/easy-waf.conf. __EASY_WAF_STATE__ → state dir.
[Service]
ExecStart=
ExecStartPre=
ExecReload=
ExecStartPre=/usr/sbin/haproxy -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -c
ExecStart=/usr/sbin/haproxy -Ws -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -p /run/haproxy.pid
ExecReload=/usr/sbin/haproxy -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -c
ExecReload=/bin/kill -USR2 $MAINPID
