# Reference drop-in. Prefer scripts/fix-haproxy-easy-waf-dropin.sh → easy-waf.conf,
# which also validates the config as the haproxy user before switching to this.
# __EASY_WAF_STATE__ → state dir. Stats socket under /run/haproxy must exist before start.
#
# HAProxy runs entirely as haproxy with only CAP_NET_BIND_SERVICE: the stock unit
# has no User=, so its master would otherwise parse the easy-waf-written config
# as root. + lines run as root.
[Service]
User=haproxy
Group=haproxy
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=true
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
# maxconn 50000 needs ~100k descriptors; only root may raise the hard limit.
LimitNOFILE=200000
RuntimeDirectory=haproxy
RuntimeDirectoryMode=0755
ExecStart=
ExecStartPre=
ExecReload=
ExecStartPre=+/bin/rm -f /run/haproxy/easy-waf-admin.sock
ExecStartPre=+/bin/sh -c '/sbin/restorecon -Rv /run/haproxy 2>/dev/null || /usr/sbin/restorecon -Rv /run/haproxy 2>/dev/null || :'
ExecStartPre=/usr/sbin/haproxy -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -c
ExecStart=/usr/sbin/haproxy -Ws -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -p /run/haproxy/haproxy.pid
ExecReload=+/bin/rm -f /run/haproxy/easy-waf-admin.sock
ExecReload=+/bin/sh -c '/sbin/restorecon -Rv /run/haproxy 2>/dev/null || /usr/sbin/restorecon -Rv /run/haproxy 2>/dev/null || :'
ExecReload=/usr/sbin/haproxy -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -c
ExecReload=/bin/kill -USR2 $MAINPID
