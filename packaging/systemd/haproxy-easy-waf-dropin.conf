# Installed to /etc/systemd/system/haproxy.service.d/50-easy-waf.conf by scripts/install.sh
# (or scripts/fix-haproxy-easy-waf-dropin.sh). __EASY_WAF_STATE__ is replaced with the real state path.
[Service]
# Stock Alma/RHEL unit loads /etc/haproxy/haproxy.cfg plus conf.d — ignore that and use only the API-rendered file.
ExecStart=
ExecStartPre=
ExecReload=
# Config check: no -q (warnings can make -c non-zero on some 3.0.x builds). pidfile via -p only (not in cfg).
ExecStartPre=/usr/sbin/haproxy -c -f __EASY_WAF_STATE__/haproxy/haproxy.cfg
ExecStart=/usr/sbin/haproxy -Ws -f __EASY_WAF_STATE__/haproxy/haproxy.cfg -p /run/haproxy.pid
ExecReload=/usr/sbin/haproxy -c -f __EASY_WAF_STATE__/haproxy/haproxy.cfg
ExecReload=/bin/kill -USR2 $MAINPID
