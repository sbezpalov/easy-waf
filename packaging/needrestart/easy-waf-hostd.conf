# Our package schedules restarts of these static Go daemons itself. In APT,
# restarting the APT owner can kill the transaction; waiting for ACME's drain
# can exceed APT's budget. Do not bypass those jobs from needrestart's hook.
# Keep every other service's selection policy unchanged.
$nrconf{override_rc}{qr(^easy-waf-(?:hostd|apt|api|acmed)(?:\.service)?$)} = 0;
