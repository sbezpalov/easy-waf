name: CI

# Product target OS is AlmaLinux (dnf, layout under /etc, /var/lib). GitHub provides Ubuntu-based
# hosted runners (runs-on: ubuntu-latest); apt-get in this workflow is only for CI HAProxy installs.
# Authoritative HAProxy/package checks: Alma host or pilot waf-dev (see docs/DEV_HOST.md).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Use Node.js 24 for GitHub-hosted JavaScript actions (checkout, setup-go, golangci-lint-action).
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

      - name: HAProxy render golden fixtures
        run: go test ./internal/haproxy/... -run Golden -count=1

      - name: go test (race)
        run: go test -race -count=1 -skip '^TestGoldenRender$' ./...

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux artifact + shell LF checks
        run: bash scripts/check-linux-artifacts.sh

      - name: Assert scripts/**/*.sh use LF only
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            if grep -q $'\r' "$f" 2>/dev/null; then
              echo "ERROR: CRLF in $f" >&2
              bad=1
            fi
          done < <(find scripts -name '*.sh' -type f -print0)
          exit "$bad"

  haproxy-config-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install HAProxy (CI runner only; production uses AlmaLinux/dnf)
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy

      - name: go test internal/haproxy (includes haproxy -c validation)
        run: go test ./internal/haproxy/... -v -count=1

      - name: go test internal/haproxy integration (golden haproxy -c)
        run: go test ./internal/haproxy/... -tags=integration -run TestGoldenConfigsPassHaproxyCheck -count=1
