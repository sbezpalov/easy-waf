name: CI

# Prod и dev — AlmaLinux 10 (dnf). Все шаги ниже выполняются в контейнере AlmaLinux 10,
# чтобы пакеты и HAProxy совпадали с целевой ОС. Поле runs-on — лишь тип ВМ GitHub
# (хост); среда выполнения job — image: almalinux:10.
#
# Пакеты ставятся ПЕРВЫМ шагом (до checkout): в контейнере JS-actions (checkout, setup-go,
# golangci-lint) требуют git + Node в PATH.
#
# Три блока «dnf» ниже держите синхронными по смыслу (общий базовый набор + профиль job).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Use Node.js 24 for GitHub-hosted JavaScript actions (checkout, setup-go, golangci-lint-action).
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OS packages (AlmaLinux 10, before checkout)
        run: |
          set -euo pipefail
          dnf -y install ca-certificates curl dnf-plugins-core
          dnf -y install \
            bash \
            bzip2 \
            coreutils \
            diffutils \
            file \
            findutils \
            gcc \
            gcc-c++ \
            git \
            glibc-devel \
            grep \
            gzip \
            make \
            openssl \
            procps-ng \
            sed \
            tar \
            tzdata \
            unzip \
            which \
            zlib-devel
          # Node.js — для checkout / setup-go / golangci-lint-action
          if ! dnf -y install nodejs npm; then
            dnf config-manager --enable crb 2>/dev/null || true
            dnf -y module reset nodejs 2>/dev/null || true
            dnf -y module enable nodejs:22 2>/dev/null || dnf -y module enable nodejs:20 2>/dev/null || true
            dnf -y install nodejs npm
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

      - name: HAProxy render golden fixtures
        run: go test ./internal/haproxy/... -run Golden -count=1

      - name: go test (race)
        run: go test -race -count=1 -skip '^TestGoldenRender$' ./...

  verify:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OS packages (AlmaLinux 10, before checkout)
        run: |
          set -euo pipefail
          dnf -y install ca-certificates curl dnf-plugins-core
          dnf -y install \
            bash \
            bzip2 \
            coreutils \
            diffutils \
            findutils \
            git \
            grep \
            gzip \
            openssl \
            procps-ng \
            sed \
            tar \
            tzdata \
            unzip \
            which
          if ! dnf -y install nodejs npm; then
            dnf config-manager --enable crb 2>/dev/null || true
            dnf -y module reset nodejs 2>/dev/null || true
            dnf -y module enable nodejs:22 2>/dev/null || dnf -y module enable nodejs:20 2>/dev/null || true
            dnf -y install nodejs npm
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Linux artifact + shell LF checks
        run: bash scripts/check-linux-artifacts.sh

      - name: Assert scripts/**/*.sh use LF only
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            if grep -q $'\r' "$f" 2>/dev/null; then
              echo "ERROR: CRLF in $f" >&2
              bad=1
            fi
          done < <(find scripts -name '*.sh' -type f -print0)
          exit "$bad"

  haproxy-config-test:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OS packages + HAProxy (AlmaLinux 10, before checkout)
        run: |
          set -euo pipefail
          dnf -y install ca-certificates curl dnf-plugins-core
          dnf -y install \
            bash \
            bzip2 \
            coreutils \
            diffutils \
            file \
            findutils \
            gcc \
            gcc-c++ \
            git \
            glibc-devel \
            grep \
            gzip \
            haproxy \
            make \
            openssl \
            procps-ng \
            sed \
            tar \
            tzdata \
            unzip \
            which \
            zlib-devel
          if ! dnf -y install nodejs npm; then
            dnf config-manager --enable crb 2>/dev/null || true
            dnf -y module reset nodejs 2>/dev/null || true
            dnf -y module enable nodejs:22 2>/dev/null || dnf -y module enable nodejs:20 2>/dev/null || true
            dnf -y install nodejs npm
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: go test internal/haproxy (includes haproxy -c validation)
        run: go test ./internal/haproxy/... -v -count=1

      - name: go test internal/haproxy integration (golden haproxy -c)
        run: go test ./internal/haproxy/... -tags=integration -run TestGoldenConfigsPassHaproxyCheck -count=1
