name: CI

# Ubuntu 24.04 LTS is the only supported appliance OS (apt, nftables, netplan).
# runs-on is the GitHub-hosted VM; job environment is container: ubuntu:24.04.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOFLAGS: -buildvcs=false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    # Store, engine and auth integration tests skip without DATABASE_URL; run them
    # against the PostgreSQL major Ubuntu 24.04 ships.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ewtest
          POSTGRES_PASSWORD: ewtest
          POSTGRES_DB: ewtest
        options: >-
          --health-cmd "pg_isready -U ewtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OS packages (before checkout)
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl \
            bash bzip2 coreutils diffutils file findutils \
            gcc g++ libc6-dev make \
            git grep gzip openssl procps sed tar tzdata unzip \
            zlib1g-dev \
            nodejs npm \
            haproxy \
            debianutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          set -euo pipefail
          GOBIN=/usr/local/bin go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(sed -n 's/^GOLANGCI_LINT_VER ?= //p' Makefile)"
          golangci-lint --version
          golangci-lint run ./... --timeout=5m

      # Fails on a known vulnerability the code actually calls.
      - name: govulncheck
        run: make vuln

      - name: HAProxy render golden fixtures
        run: go test ./internal/haproxy/... -run Golden -count=1

      - name: go test (race, with PostgreSQL)
        env:
          DATABASE_URL: postgres://ewtest:ewtest@postgres:5432/ewtest?sslmode=disable
        # One package at a time: the integration tests share one database.
        run: go test -race -count=1 -p 1 -skip '^TestGoldenRender$' ./...

  verify:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OS packages (before checkout)
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl \
            bash bzip2 coreutils diffutils findutils \
            git grep gzip openssl procps sed tar tzdata unzip \
            nodejs npm debianutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux artifact + shell LF checks
        run: bash scripts/check-linux-artifacts.sh

      - name: Assert scripts/**/*.sh use LF only
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            if grep -q $'\r' "$f" 2>/dev/null; then
              echo "ERROR: CRLF in $f" >&2
              bad=1
            fi
          done < <(find scripts -name '*.sh' -type f -print0)
          exit "$bad"

      - name: Installer scripts syntax (bash -n)
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/install-interactive.sh
          bash -n scripts/crowdsec-bootstrap-lapi.sh
          bash -n scripts/lib/os-pkg.sh
          bash -n scripts/lib/nftables-easy-waf.sh
          bash -n scripts/host/privileged.sh
          bash -n scripts/diagnostics.sh

  haproxy-config-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OS packages + HAProxy (before checkout)
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl \
            bash bzip2 coreutils diffutils file findutils \
            gcc g++ libc6-dev make \
            git grep gzip openssl procps sed tar tzdata unzip \
            zlib1g-dev \
            nodejs npm \
            haproxy \
            debianutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test internal/haproxy (includes haproxy -c validation)
        run: go test ./internal/haproxy/... -v -count=1

      - name: go test internal/haproxy integration (golden haproxy -c)
        run: go test ./internal/haproxy/... -tags=integration -run TestGoldenConfigsPassHaproxyCheck -count=1
