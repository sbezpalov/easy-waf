name: Release

# Push tag v* → linux/amd64 and linux/arm64 tarballs and .deb files, SHA256SUMS
# signed with cosign, plus verified offline ISOs for both architectures.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOFLAGS: -buildvcs=false

jobs:
  # Local reusable workflow resolves at this tag's commit, not moving main.
  # Validation does not need the publishing or signing permissions below.
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-packages:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Keyless signature of SHA256SUMS
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The tag is what release artifacts are named after, so it has to agree
      # with VERSION — otherwise install.sh looks for a file that is not there.
      - name: Validate release metadata and prepare notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(head -1 VERSION | tr -d '[:space:]')"
          if [[ "$VERSION" != "$FILE_VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION (${FILE_VERSION})" >&2
            exit 1
          fi
          bash scripts/release-notes.sh "$VERSION" CHANGELOG.md > release_notes.md

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      # Go cross-compiles both arches. CGO is off, so arm64 does not need a
      # native runner. One SHA256SUMS covers every file, then cosign signs it.
      - name: Build amd64 and arm64 tarballs and packages
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            rm -rf dist
            EASY_WAF_ARCH="$arch" make deb
            STAGE="$(mktemp -d)"
            mkdir -p "${STAGE}/dist" "${STAGE}/packaging/systemd" "${STAGE}/configs/defaults" "${STAGE}/scripts/lib"
            cp -a dist/easy-waf-hostd dist/easy-waf-api dist/easy-waf-acmed dist/easy-wafd dist/easy-waf-admin "${STAGE}/dist/"
            cp -a LICENSE NOTICE "${STAGE}/"
            cp -a packaging/systemd/*.service packaging/systemd/haproxy-easy-waf-dropin.conf "${STAGE}/packaging/systemd/"
            cp -a configs/defaults/easy-waf.env.example configs/defaults/haproxy-bootstrap.cfg "${STAGE}/configs/defaults/"
            cp -a scripts/fix-haproxy-easy-waf-dropin.sh "${STAGE}/scripts/"
            cp -a scripts/lib/selinux-easy-waf-haproxy.sh "${STAGE}/scripts/lib/"
            NAME="easy-waf_${VERSION}_linux_${arch}.tar.gz"
            DEB="easy-waf_${VERSION}_${arch}.deb"
            tar -czf "${NAME}" -C "${STAGE}" .
            mv "dist/${DEB}" .
            rm -rf "${STAGE}"
          done
          # Every artifact in one SHA256SUMS: scripts/lib/release-verify.sh looks
          # the file up by name, and installing an unverified .deb would be root
          # code execution just like an unverified tarball.
          sha256sum easy-waf_"${VERSION}"_linux_amd64.tar.gz easy-waf_"${VERSION}"_amd64.deb \
            easy-waf_"${VERSION}"_linux_arm64.tar.gz easy-waf_"${VERSION}"_arm64.deb > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Ties SHA256SUMS to this workflow on this repository; checked by
      # scripts/lib/release-verify.sh and in docs/SECURITY.md.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify signed release artifacts before publication
        run: |
          set -euo pipefail
          source scripts/lib/release-verify.sh
          easy_waf_verify_github_blob SHA256SUMS SHA256SUMS.sigstore.json "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          sha256sum --check --strict SHA256SUMS

      - name: Stage signed release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            easy-waf_*_amd64.deb
            easy-waf_*_arm64.deb
            easy-waf_*_linux_amd64.tar.gz
            easy-waf_*_linux_arm64.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json
            release_notes.md
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  offline-bundle:
    needs: build-packages
    permissions:
      contents: read
      id-token: write # Keyless signature of the ISO
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install offline bundle tools and configure CrowdSec repository
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev xorriso gnupg ca-certificates curl
          sudo bash -c 'source scripts/lib/crowdsec-install.sh; crowdsec_add_apt_repo'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Download staged release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      - name: Verify the matching Easy WAF package
        run: |
          set -euo pipefail
          source scripts/lib/release-verify.sh
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="easy-waf_${VERSION}_${{ matrix.arch }}.deb"
          cd dist
          easy_waf_verify_github_blob SHA256SUMS SHA256SUMS.sigstore.json "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          easy_waf_verify_release_artifact "$DEB" "$DEB" "$PWD/SHA256SUMS"

      - name: Build offline ISO
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EASY_WAF_DEB="dist/easy-waf_${VERSION}_${{ matrix.arch }}.deb" bash scripts/build-offline-bundle.sh
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$CHECK_DIR"' EXIT
          xorriso -osirrox on -indev "dist/easy-waf_${VERSION}_offline_ubuntu24.04_${{ matrix.arch }}.iso" \
            -extract / "$CHECK_DIR"
          bash "$CHECK_DIR/install.sh" --verify-only
          grep -Fxq 'EASY_WAF_BUNDLE_CROWDSEC=1' "$CHECK_DIR/BUNDLE.env"
          [[ ! -e "$CHECK_DIR/payload/crowdsec-snapshot" && ! -L "$CHECK_DIR/payload/crowdsec-snapshot" ]]

      - name: Sign and verify offline ISO
        run: |
          set -euo pipefail
          source scripts/lib/release-verify.sh
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="easy-waf_${VERSION}_offline_ubuntu24.04_${{ matrix.arch }}.iso"
          cd dist
          sha256sum "$NAME" >"${NAME}.sha256"
          cosign sign-blob --yes --bundle "${NAME}.sigstore.json" "$NAME"
          easy_waf_verify_github_blob "$NAME" "${NAME}.sigstore.json" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

      - name: Stage signed offline ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-iso-${{ matrix.arch }}
          path: |
            dist/easy-waf_*_offline_ubuntu24.04_${{ matrix.arch }}.iso
            dist/easy-waf_*_offline_ubuntu24.04_${{ matrix.arch }}.iso.sha256
            dist/easy-waf_*_offline_ubuntu24.04_${{ matrix.arch }}.iso.sigstore.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [build-packages, offline-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Download staged release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-assets

      - name: Download staged amd64 ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-iso-amd64
          path: release-assets

      - name: Download staged arm64 ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-iso-arm64
          path: release-assets

      - name: Verify and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh release-assets
