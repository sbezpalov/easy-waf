name: Release

# Push tag v* → linux/amd64 and linux/arm64 tarballs and .deb files, SHA256SUMS
# signed with cosign, GitHub Release notes from CHANGELOG.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # keyless cosign signature of SHA256SUMS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOFLAGS: -buildvcs=false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The tag is what release artifacts are named after, so it has to agree
      # with VERSION — otherwise install.sh looks for a file that is not there.
      - name: Check VERSION matches the tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(head -1 VERSION | tr -d '[:space:]')"
          if [[ "$VERSION" != "$FILE_VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION (${FILE_VERSION})" >&2
            exit 1
          fi

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      # Go cross-compiles both arches. CGO is off, so arm64 does not need a
      # native runner. One SHA256SUMS covers every file, then cosign signs it.
      - name: Build amd64 and arm64 tarballs and packages
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            rm -rf dist
            EASY_WAF_ARCH="$arch" make deb
            STAGE="$(mktemp -d)"
            mkdir -p "${STAGE}/dist" "${STAGE}/packaging/systemd" "${STAGE}/configs/defaults" "${STAGE}/scripts/lib"
            cp -a dist/easy-waf-hostd dist/easy-waf-api dist/easy-waf-acmed dist/easy-wafd dist/easy-waf-admin "${STAGE}/dist/"
            cp -a LICENSE NOTICE "${STAGE}/"
            cp -a packaging/systemd/*.service packaging/systemd/haproxy-easy-waf-dropin.conf "${STAGE}/packaging/systemd/"
            cp -a configs/defaults/easy-waf.env.example configs/defaults/haproxy-bootstrap.cfg "${STAGE}/configs/defaults/"
            cp -a scripts/fix-haproxy-easy-waf-dropin.sh "${STAGE}/scripts/"
            cp -a scripts/lib/selinux-easy-waf-haproxy.sh "${STAGE}/scripts/lib/"
            NAME="easy-waf_${VERSION}_linux_${arch}.tar.gz"
            DEB="easy-waf_${VERSION}_${arch}.deb"
            tar -czf "${NAME}" -C "${STAGE}" .
            mv "dist/${DEB}" .
            rm -rf "${STAGE}"
          done
          # Every artifact in one SHA256SUMS: scripts/lib/release-verify.sh looks
          # the file up by name, and installing an unverified .deb would be root
          # code execution just like an unverified tarball.
          sha256sum easy-waf_"${VERSION}"_linux_amd64.tar.gz easy-waf_"${VERSION}"_amd64.deb \
            easy-waf_"${VERSION}"_linux_arm64.tar.gz easy-waf_"${VERSION}"_arm64.deb > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      # Ties SHA256SUMS to this workflow on this repository; checked by
      # scripts/lib/release-verify.sh and in docs/SECURITY.md.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag
          ' CHANGELOG.md > release_notes.md
          if ! [[ -s release_notes.md ]]; then
            echo "CHANGELOG.md: no section ## [${VERSION}]" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            easy-waf_*_amd64.deb
            easy-waf_*_arm64.deb
            easy-waf_*_linux_amd64.tar.gz
            easy-waf_*_linux_arm64.tar.gz
            SHA256SUMS
            SHA256SUMS.sigstore.json
          body_path: release_notes.md
          fail_on_unmatched_files: true
          # A tag like v1.7.0-rc.1 must not become what people install by default.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  offline-bundle:
    needs: build-and-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install offline bundle tools and configure CrowdSec repository
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev xorriso gnupg ca-certificates curl
          sudo bash -c 'source scripts/lib/crowdsec-install.sh; crowdsec_add_apt_repo'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Download and verify the matching Easy WAF package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          DEB="easy-waf_${VERSION}_${{ matrix.arch }}.deb"
          gh release download "${GITHUB_REF_NAME}" --dir dist \
            --pattern "$DEB" --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
          cd dist
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          grep -F "  $DEB" SHA256SUMS >DEB_SHA256SUM
          [[ "$(wc -l <DEB_SHA256SUM)" -eq 1 ]]
          sha256sum -c DEB_SHA256SUM

      - name: Build offline ISO
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EASY_WAF_DEB="dist/easy-waf_${VERSION}_${{ matrix.arch }}.deb" bash scripts/build-offline-bundle.sh

      - name: Sign and upload offline ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="easy-waf_${VERSION}_offline_ubuntu24.04_${{ matrix.arch }}.iso"
          cd dist
          sha256sum "$NAME" >"${NAME}.sha256"
          cosign sign-blob --yes --bundle "${NAME}.sigstore.json" "$NAME"
          gh release upload "${GITHUB_REF_NAME}" "$NAME" "${NAME}.sha256" "${NAME}.sigstore.json" --clobber
