      <div id="tab-network" class="tab-panel">
        <h2>⇄ Network</h2>
        <div class="panel" style="max-width:100%">
          <h3>Overview</h3>
          <div id="net-overview" role="status" class="dash-note" style="color:#e6edf3;white-space:pre-wrap">Loading…</div>
        </div>
        <div class="panel" style="max-width:100%">
          <h3>Netplan <small>(Advanced)</small></h3>
          <p class="dash-note" style="margin-top:0">Edit the managed Netplan file, then review it before applying. If connectivity changes, reconnect and select <strong>Keep changes</strong> within 90 seconds.</p>
          <label class="field-label" for="net-netplan-yaml">Netplan YAML</label>
          <textarea id="net-netplan-yaml" rows="10" style="width:100%;max-width:48rem;font-family:monospace;font-size:12px" placeholder="# 99-easy-waf.yaml"></textarea>
          <div class="row" style="margin-top:0.5rem">
            <button type="button" id="btn-net-netplan-apply">Review Netplan configuration</button>
          </div>
          <p id="net-netplan-msg" role="status" class="warn" style="margin-top:0.35rem"></p>
        </div>
        <div class="panel" style="max-width:100%">
          <h3>Firewall / nftables <small>(Advanced)</small></h3>
          <p class="dash-note" style="margin-top:0">Managed file <code>/etc/nftables/easy-waf.nft</code>. Same safety window as netplan.</p>
          <label class="field-label" for="net-firewall-rules">nftables ruleset</label>
          <div id="net-firewall-load-status" role="status" class="warn"></div>
          <textarea id="net-firewall-rules" rows="12" style="width:100%;max-width:48rem;font-family:monospace;font-size:12px"></textarea>
          <div class="row" style="margin-top:0.5rem">
            <button type="button" id="btn-net-firewall-apply">Review firewall rules</button>
          </div>
          <p id="net-firewall-msg" role="status" class="warn" style="margin-top:0.35rem"></p>
        </div>
      </div>
