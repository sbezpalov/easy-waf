
global
	log stdout format raw local0
	maxconn 50000
	# The stock haproxy.service starts as root; drop it after binding.
	user haproxy
	group haproxy
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy/haproxy.pid (see haproxy.service.d drop-in).
	# Mozilla "intermediate" without DHE: TLS 1.2 with ECDHE AEAD suites, and TLS 1.3.
	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	# httplog shows {host|rule}: the rule that refused a request (Logs → Blocked requests).
	declare capture request len 64
	declare capture request len 24
	http-request capture req.hdr(host) id 0
	acl acme path_beg /.well-known/acme-challenge/

	acl redir_fe_any_host hdr(host) -i a.example.com b.example.org

	http-request redirect scheme https code 301 if redir_fe_any_host !acme
	http-request redirect scheme https code 301 if !acme

	use_backend bk_acme if acme


# ACME challenges: easy-waf-api loopback serves Lego webroot (setting acme_internal_http, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check

# CrowdSec SPOA bouncer. The name is fixed by use-backend in the vendor's SPOE file;
# the installer binds the bouncer to this loopback address.
backend crowdsec-spoa
	mode tcp
	timeout connect 2s
	timeout server 60s
	server spoa 127.0.0.1:9000



# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/multi-app-sni.crt-list.txt alpn h2,http/1.1
	mode http
	# httplog shows {host|rule}: the rule that refused a request (Logs → Blocked requests).
	declare capture request len 64
	declare capture request len 24
	http-request capture req.hdr(host) id 0
	option forwardfor

	# CrowdSec SPOE — engine id must match the [section] in testdata/golden/spoe/crowdsec-vendor.cfg.
	# The bouncer's messages send unique-id, so the frontend must define one.
	unique-id-format %[uuid()]
	filter spoe engine crowdsec config testdata/golden/spoe/crowdsec-vendor.cfg

	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000" if { ssl_fc }
	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request capture str(sensitive_path) id 1 if p_git || p_env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request capture str(method) id 1 if bad_method
	http-request deny deny_status 405 if bad_method

	acl app_a1_host hdr(host) -i a.example.com
# === Application: App A (a.example.com) ===
	acl app_a1_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_a1_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_a1_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_a1_xss_path path -m reg -i (<script|javascript:)
	acl app_a1_traversal path -m reg -i \.\./
	http-request capture str(sqli) id 1 if app_a1_host app_a1_sqli
	http-request deny deny_status 403 if app_a1_host app_a1_sqli
	http-request capture str(sqli) id 1 if app_a1_host app_a1_sqli_path
	http-request deny deny_status 403 if app_a1_host app_a1_sqli_path
	http-request capture str(xss) id 1 if app_a1_host app_a1_xss
	http-request deny deny_status 403 if app_a1_host app_a1_xss
	http-request capture str(xss) id 1 if app_a1_host app_a1_xss_path
	http-request deny deny_status 403 if app_a1_host app_a1_xss_path
	http-request capture str(traversal) id 1 if app_a1_host app_a1_traversal
	http-request deny deny_status 403 if app_a1_host app_a1_traversal
	acl app_a1_bm_0_trace method TRACE
	http-request capture str(method) id 1 if app_a1_host app_a1_bm_0_trace
	http-request deny deny_status 405 if app_a1_host app_a1_bm_0_trace
	acl app_a1_bm_1_connect method CONNECT
	http-request capture str(method) id 1 if app_a1_host app_a1_bm_1_connect
	http-request deny deny_status 405 if app_a1_host app_a1_bm_1_connect
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /.git }
	http-request deny deny_status 403 if app_a1_host { path_beg /.git }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /.env }
	http-request deny deny_status 403 if app_a1_host { path_beg /.env }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /.svn }
	http-request deny deny_status 403 if app_a1_host { path_beg /.svn }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /.hg }
	http-request deny deny_status 403 if app_a1_host { path_beg /.hg }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_a1_host { path_beg /wp-admin }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_a1_host { path_beg /wp-login.php }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_a1_host { path_beg /xmlrpc.php }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_a1_host { path_beg /.well-known/security.txt }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_a1_host { path_beg /vendor/phpunit }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /config }
	http-request deny deny_status 403 if app_a1_host { path_beg /config }
	http-request capture str(blocked_path) id 1 if app_a1_host { path_beg /backup.sql }
	http-request deny deny_status 403 if app_a1_host { path_beg /backup.sql }
	# No body group: nothing here inspects bodies, so no request is buffered for it.
	# The bouncer answers in txn.crowdsec.remediation; without this deny its decisions do nothing.
	# When it cannot be reached the variable stays unset and traffic passes (fail open).
	http-request send-spoe-group crowdsec crowdsec-http-no-body if app_a1_host
	http-request capture str(crowdsec) id 1 if app_a1_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }
	# A page rather than a bare 403: the visitor learns why and what to send the owner.
	http-request return status 403 content-type "text/html; charset=utf-8" hdr Cache-Control no-store lf-string "<!doctype html><title>Access denied</title><h1>Access denied</h1><p>Your address %[src] is blocked on this site by CrowdSec, a shared reputation service. If this is a mistake, send this address to the site owner.</p>" if app_a1_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }


	acl app_a2_host hdr(host) -i b.example.org
# === Application: App B (b.example.org) ===
	acl app_a2_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_a2_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_a2_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_a2_xss_path path -m reg -i (<script|javascript:)
	acl app_a2_traversal path -m reg -i \.\./
	http-request capture str(sqli) id 1 if app_a2_host app_a2_sqli
	http-request deny deny_status 403 if app_a2_host app_a2_sqli
	http-request capture str(sqli) id 1 if app_a2_host app_a2_sqli_path
	http-request deny deny_status 403 if app_a2_host app_a2_sqli_path
	http-request capture str(xss) id 1 if app_a2_host app_a2_xss
	http-request deny deny_status 403 if app_a2_host app_a2_xss
	http-request capture str(xss) id 1 if app_a2_host app_a2_xss_path
	http-request deny deny_status 403 if app_a2_host app_a2_xss_path
	http-request capture str(traversal) id 1 if app_a2_host app_a2_traversal
	http-request deny deny_status 403 if app_a2_host app_a2_traversal
	acl app_a2_bm_0_trace method TRACE
	http-request capture str(method) id 1 if app_a2_host app_a2_bm_0_trace
	http-request deny deny_status 405 if app_a2_host app_a2_bm_0_trace
	acl app_a2_bm_1_connect method CONNECT
	http-request capture str(method) id 1 if app_a2_host app_a2_bm_1_connect
	http-request deny deny_status 405 if app_a2_host app_a2_bm_1_connect
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /.git }
	http-request deny deny_status 403 if app_a2_host { path_beg /.git }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /.env }
	http-request deny deny_status 403 if app_a2_host { path_beg /.env }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /.svn }
	http-request deny deny_status 403 if app_a2_host { path_beg /.svn }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /.hg }
	http-request deny deny_status 403 if app_a2_host { path_beg /.hg }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_a2_host { path_beg /wp-admin }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_a2_host { path_beg /wp-login.php }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_a2_host { path_beg /xmlrpc.php }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_a2_host { path_beg /.well-known/security.txt }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_a2_host { path_beg /vendor/phpunit }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /config }
	http-request deny deny_status 403 if app_a2_host { path_beg /config }
	http-request capture str(blocked_path) id 1 if app_a2_host { path_beg /backup.sql }
	http-request deny deny_status 403 if app_a2_host { path_beg /backup.sql }
	# No body group: nothing here inspects bodies, so no request is buffered for it.
	# The bouncer answers in txn.crowdsec.remediation; without this deny its decisions do nothing.
	# When it cannot be reached the variable stays unset and traffic passes (fail open).
	http-request send-spoe-group crowdsec crowdsec-http-no-body if app_a2_host
	http-request capture str(crowdsec) id 1 if app_a2_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }
	# A page rather than a bare 403: the visitor learns why and what to send the owner.
	http-request return status 403 content-type "text/html; charset=utf-8" hdr Cache-Control no-store lf-string "<!doctype html><title>Access denied</title><h1>Access denied</h1><p>Your address %[src] is blocked on this site by CrowdSec, a shared reputation service. If this is a mistake, send this address to the site owner.</p>" if app_a2_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }



	use_backend bk_a_example_com if app_a1_host

	use_backend bk_b_example_org if app_a2_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_a_example_com
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_0
	server s1 10.0.0.1:8080 check inter 3s fall 3 rise 2

backend bk_b_example_org
	mode http
	timeout connect 5s
	timeout server 3600s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_1 sc0_http_req_rate gt 80
	http-request deny deny_status 429 if rl_abuse_1
	timeout tunnel 3600s
	server s1 10.0.0.2:8123 check inter 3s fall 3 rise 2


