
global
	log stdout format raw local0
	maxconn 50000
	# The stock haproxy.service starts as root; drop it after binding.
	user haproxy
	group haproxy
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy/haproxy.pid (see haproxy.service.d drop-in).
	# Mozilla "intermediate" without DHE: TLS 1.2 with ECDHE AEAD suites, and TLS 1.3.
	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/

	acl redir_fe_any_host hdr(host) -i mcp.example.com

	http-request redirect scheme https code 301 if redir_fe_any_host !acme
	http-request redirect scheme https code 301 if !acme

	use_backend bk_acme if acme


# ACME challenges: easy-waf-api loopback serves Lego webroot (setting acme_internal_http, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check

# CrowdSec SPOA bouncer. The name is fixed by use-backend in the vendor's SPOE file;
# the installer binds the bouncer to this loopback address.
backend crowdsec-spoa
	mode tcp
	timeout connect 2s
	timeout server 60s
	server spoa 127.0.0.1:9000



# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/ha-mcp.crt-list.txt alpn h2,http/1.1
	mode http
	# HAProxy 2.8 cannot change timeout client per request. This is the longest any app on this frontend asked for.
	# timeout http-request still aborts an incomplete request, which the client timeout does not.
	timeout client 3600s
	timeout http-request 10s
	option forwardfor

	# CrowdSec SPOE — engine id must match the [section] in testdata/golden/spoe/crowdsec-vendor.cfg.
	# The bouncer's messages send unique-id, so the frontend must define one.
	unique-id-format %[uuid()]
	filter spoe engine crowdsec config testdata/golden/spoe/crowdsec-vendor.cfg

	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000" if { ssl_fc }
	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method

	acl app_mcp1_host hdr(host) -i mcp.example.com
# === Application: HA MCP (mcp.example.com) ===
	# Allowlist is evaluated before the IP allow shortcut, so a trusted source still cannot reach other paths.
	acl app_mcp1_allow path -m str /api/mcp /mcp_server/sse /auth /.well-known/oauth-authorization-server
	acl app_mcp1_allow path_beg /api/mcp/ /mcp_server/sse/ /auth/ /.well-known/oauth-authorization-server/
	http-request deny deny_status 404 if app_mcp1_host !app_mcp1_allow

	acl app_mcp1_pp_1 path -m str /api/mcp
	acl app_mcp1_pp_1 path_beg /api/mcp/

	acl app_mcp1_pp_1_hdr req.hdr(Authorization) -m beg "Bearer "
	# httplog stays on the request line; this header is not captured.
	http-request deny deny_status 401 if app_mcp1_host app_mcp1_pp_1 !app_mcp1_pp_1_hdr

	acl app_mcp1_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_mcp1_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_mcp1_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_mcp1_xss_path path -m reg -i (<script|javascript:)
	acl app_mcp1_traversal path -m reg -i \.\./
	http-request deny deny_status 403 if app_mcp1_host app_mcp1_sqli
	http-request deny deny_status 403 if app_mcp1_host app_mcp1_sqli_path
	http-request deny deny_status 403 if app_mcp1_host app_mcp1_xss
	http-request deny deny_status 403 if app_mcp1_host app_mcp1_xss_path
	http-request deny deny_status 403 if app_mcp1_host app_mcp1_traversal
	acl app_mcp1_bm_0_trace method TRACE
	http-request deny deny_status 405 if app_mcp1_host app_mcp1_bm_0_trace
	acl app_mcp1_bm_1_connect method CONNECT
	http-request deny deny_status 405 if app_mcp1_host app_mcp1_bm_1_connect
	http-request deny deny_status 403 if app_mcp1_host { path_beg /.git }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /.env }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /.svn }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /.hg }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /config }
	http-request deny deny_status 403 if app_mcp1_host { path_beg /backup.sql }
	# No body group: nothing here inspects bodies, so no request is buffered for it.
	# The bouncer answers in txn.crowdsec.remediation; without this deny its decisions do nothing.
	# When it cannot be reached the variable stays unset and traffic passes (fail open).
	http-request send-spoe-group crowdsec crowdsec-http-no-body if app_mcp1_host
	http-request deny deny_status 403 if app_mcp1_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }



	use_backend bk_mcp_example_com if app_mcp1_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend st_mcp1_0
	stick-table type ip size 50k expire 5m store http_req_rate(10s)
backend st_mcp1_1
	stick-table type ip size 50k expire 5m store http_req_rate(10s)
backend st_mcp1_2
	stick-table type ip size 50k expire 5m store http_req_rate(10s)
backend bk_mcp_example_com
	mode http
	timeout connect 5s
	timeout server 3600s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 40
	http-request deny deny_status 429 if rl_abuse_0
	acl app_mcp1_pp_0 path -m str /mcp_server/sse
	acl app_mcp1_pp_0 path_beg /mcp_server/sse/
	acl app_mcp1_pp_1 path -m str /api/mcp
	acl app_mcp1_pp_1 path_beg /api/mcp/
	acl app_mcp1_pp_2 path -m str /auth
	acl app_mcp1_pp_2 path_beg /auth/
	http-request set-timeout server 3600s if app_mcp1_pp_0
	http-request track-sc1 src table st_mcp1_0 if app_mcp1_pp_0
	http-request deny deny_status 429 if app_mcp1_pp_0 { sc1_http_req_rate(st_mcp1_0) gt 10 }
	http-request track-sc1 src table st_mcp1_1 if app_mcp1_pp_1 !app_mcp1_pp_0
	http-request deny deny_status 429 if app_mcp1_pp_1 !app_mcp1_pp_0 { sc1_http_req_rate(st_mcp1_1) gt 20 }
	http-request track-sc1 src table st_mcp1_2 if app_mcp1_pp_2 !app_mcp1_pp_0 !app_mcp1_pp_1
	http-request deny deny_status 429 if app_mcp1_pp_2 !app_mcp1_pp_0 !app_mcp1_pp_1 { sc1_http_req_rate(st_mcp1_2) gt 40 }
	server s1 10.0.0.50:8123 check inter 3s fall 3 rise 2


