# Custom engine scope for full-stack golden (must match filter spoe engine ew_cs_engine).
[ew_cs_engine]

spoe-agent ew_cs_engine
	groups crowdsec-req
	option var-prefix crowdsec
	timeout hello 100ms
	timeout idle 30s
	timeout processing 5s
	use-backend crowdsec-socket
	log global

spoe-group crowdsec-req
	messages crowdsec

spoe-message crowdsec
	args src
