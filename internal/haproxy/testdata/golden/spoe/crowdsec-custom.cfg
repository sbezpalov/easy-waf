# Custom engine name for full-stack golden fixture (engine id must match `filter spoe engine`).
spoe-agent ew_cs_engine {
    messages    crowdsec
    option      var-prefix crowdsec
    timeout     hello   100ms
    timeout     idle    30s
    timeout     processing 5s
    use-backend crowdsec-socket-ft
    log         global
}

crowdsec-socket-ft {
    server crowdsec 127.0.0.1:9000
}

message crowdsec {
    args id=unique-id src-ip=src src-port=src_port
    event on-frontend-http-request
}
