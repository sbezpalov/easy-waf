# Minimal SPOE agent for `haproxy -c` on golden fixtures (not a production CrowdSec install).
spoe-agent crowdsec {
    messages    crowdsec
    option      var-prefix crowdsec
    timeout     hello   100ms
    timeout     idle    30s
    timeout     processing 5s
    use-backend crowdsec-socket
    log         global
}

crowdsec-socket {
    server crowdsec 127.0.0.1:9000
}

message crowdsec {
    args id=unique-id src-ip=src src-port=src_port
    event on-frontend-http-request
}
