# Minimal SPOE for HAProxy 2.8+ (golden + haproxy -c). Not a production CrowdSec install.
# Engine name on "filter spoe engine …" must match this […] scope.
[crowdsec]

spoe-agent crowdsec
	groups crowdsec-req
	option var-prefix crowdsec
	timeout hello 100ms
	timeout idle 30s
	timeout processing 5s
	use-backend crowdsec-socket
	log global

spoe-group crowdsec-req
	messages crowdsec

spoe-message crowdsec
	args src
