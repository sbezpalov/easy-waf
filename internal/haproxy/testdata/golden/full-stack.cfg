
global
	log stdout format raw local0
	maxconn 50000
	stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	pidfile /run/haproxy.pid

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s

# HTTP — ACME HTTP-01 + HTTPS redirect
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/
	use_backend bk_acme if acme
	http-request redirect scheme https code 301 unless acme

# ACME challenges served by easy-wafd local listener (see scripts / docs)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check

# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/full-stack.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }
	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/crowdsec-custom.cfg
	filter spoe engine ew_cs_engine config testdata/golden/spoe/crowdsec-custom.cfg
	# Universal blocks (all vhosts); per-app profile paths are scoped below
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method




	acl ipbl_black src -f testdata/golden/ipbl/test.map
	http-request deny deny_status 403 if ipbl_black



	acl host_bk_a_example_com hdr(host) -i a.example.com

	acl bp_0_0 path_beg /.git
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_0

	acl bp_0_1 path_beg /.env
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_1

	acl bp_0_2 path_beg /.svn
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_2

	acl bp_0_3 path_beg /.hg
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_3

	acl bp_0_4 path_beg /wp-admin
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_4

	acl bp_0_5 path_beg /wp-login.php
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_5

	acl bp_0_6 path_beg /xmlrpc.php
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_6

	acl bp_0_7 path_beg /.well-known/security.txt
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_7

	acl bp_0_8 path_beg /vendor/phpunit
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_8

	acl bp_0_9 path_beg /config
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_9

	acl bp_0_10 path_beg /backup.sql
	http-request deny deny_status 403 if host_bk_a_example_com bp_0_10


	acl bm_0_0_trace method TRACE
	http-request deny deny_status 405 if host_bk_a_example_com bm_0_0_trace

	acl bm_0_1_connect method CONNECT
	http-request deny deny_status 405 if host_bk_a_example_com bm_0_1_connect



	acl host_bk_b_example_org hdr(host) -i b.example.org

	acl bp_1_0 path_beg /.git
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_0

	acl bp_1_1 path_beg /.env
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_1

	acl bp_1_2 path_beg /.svn
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_2

	acl bp_1_3 path_beg /.hg
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_3

	acl bp_1_4 path_beg /wp-admin
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_4

	acl bp_1_5 path_beg /wp-login.php
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_5

	acl bp_1_6 path_beg /xmlrpc.php
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_6

	acl bp_1_7 path_beg /.well-known/security.txt
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_7

	acl bp_1_8 path_beg /vendor/phpunit
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_8

	acl bp_1_9 path_beg /config
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_9

	acl bp_1_10 path_beg /backup.sql
	http-request deny deny_status 403 if host_bk_b_example_org bp_1_10


	acl bm_1_0_trace method TRACE
	http-request deny deny_status 405 if host_bk_b_example_org bm_1_0_trace

	acl bm_1_1_connect method CONNECT
	http-request deny deny_status 405 if host_bk_b_example_org bm_1_1_connect



	acl host_bk_c_example_net hdr(host) -i c.example.net

	acl bp_2_0 path_beg /.git
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_0

	acl bp_2_1 path_beg /.env
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_1

	acl bp_2_2 path_beg /.svn
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_2

	acl bp_2_3 path_beg /.hg
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_3

	acl bp_2_4 path_beg /wp-admin
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_4

	acl bp_2_5 path_beg /wp-login.php
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_5

	acl bp_2_6 path_beg /xmlrpc.php
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_6

	acl bp_2_7 path_beg /.well-known/security.txt
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_7

	acl bp_2_8 path_beg /vendor/phpunit
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_8

	acl bp_2_9 path_beg /config
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_9

	acl bp_2_10 path_beg /backup.sql
	http-request deny deny_status 403 if host_bk_c_example_net bp_2_10


	acl bm_2_0_trace method TRACE
	http-request deny deny_status 405 if host_bk_c_example_net bm_2_0_trace

	acl bm_2_1_connect method CONNECT
	http-request deny deny_status 405 if host_bk_c_example_net bm_2_1_connect




	use_backend bk_a_example_com if host_bk_a_example_com

	use_backend bk_b_example_org if host_bk_b_example_org

	use_backend bk_c_example_net if host_bk_c_example_net

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404


backend bk_a_example_com
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 100

	http-request deny deny_status 429 if rl_abuse_0

	server s1 10.0.0.1:8080 check inter 3s fall 3 rise 2

backend bk_b_example_org
	mode http
	timeout connect 5s
	timeout server 3600s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_1 sc0_http_req_rate gt 80

	http-request deny deny_status 429 if rl_abuse_1

	timeout tunnel 3600s
	server s1 10.0.0.2:8123 check inter 3s fall 3 rise 2

backend bk_c_example_net
	mode http
	timeout connect 5s
	timeout server 60s
	option http-server-close
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_2 sc0_http_req_rate gt 60

	http-request deny deny_status 429 if rl_abuse_2

	server s1 10.0.0.3:443 ssl verify none check inter 3s fall 3 rise 2

