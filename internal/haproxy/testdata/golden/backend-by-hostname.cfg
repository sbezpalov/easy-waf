
global
	log stdout format raw local0
	maxconn 50000
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy.pid (see haproxy.service.d drop-in).

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# System DNS (split-DNS / internal forwarders via /etc/resolv.conf)
resolvers easy_waf_dns
	parse-resolv-conf
	resolve_retries 3
	timeout resolve 2s
	timeout retry 2s
	hold valid 30s
	hold nx 5s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/

	acl redir_fe_any_host hdr(host) -i nas.example.com

	http-request redirect scheme https code 301 if redir_fe_any_host !acme
	http-request redirect scheme https code 301 if !acme

	use_backend bk_acme if acme


# ACME challenges: easy-waf-api loopback serves Lego webroot (setting acme_internal_http, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check



# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/backend-by-hostname.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor

	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/minimal-spoe.cfg
	filter spoe engine crowdsec config testdata/golden/spoe/minimal-spoe.cfg

	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }
	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method

	acl app_bh1_host hdr(host) -i nas.example.com
# === Application: NAS (nas.example.com) ===
	acl app_bh1_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_bh1_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_bh1_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_bh1_xss_path path -m reg -i (<script|javascript:)
	acl app_bh1_traversal path -m reg -i \.\./
	http-request deny deny_status 403 if app_bh1_host app_bh1_sqli
	http-request deny deny_status 403 if app_bh1_host app_bh1_sqli_path
	http-request deny deny_status 403 if app_bh1_host app_bh1_xss
	http-request deny deny_status 403 if app_bh1_host app_bh1_xss_path
	http-request deny deny_status 403 if app_bh1_host app_bh1_traversal
	acl app_bh1_bm_0_trace method TRACE
	http-request deny deny_status 405 if app_bh1_host app_bh1_bm_0_trace
	acl app_bh1_bm_1_connect method CONNECT
	http-request deny deny_status 405 if app_bh1_host app_bh1_bm_1_connect
	http-request deny deny_status 403 if app_bh1_host { path_beg /.git }
	http-request deny deny_status 403 if app_bh1_host { path_beg /.env }
	http-request deny deny_status 403 if app_bh1_host { path_beg /.svn }
	http-request deny deny_status 403 if app_bh1_host { path_beg /.hg }
	http-request deny deny_status 403 if app_bh1_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_bh1_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_bh1_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_bh1_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_bh1_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_bh1_host { path_beg /config }
	http-request deny deny_status 403 if app_bh1_host { path_beg /backup.sql }
	http-request send-spoe-group crowdsec crowdsec-req if app_bh1_host



	use_backend bk_nas_example_com if app_bh1_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_nas_example_com
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_0
	server s1 nas.lan:8080 resolvers easy_waf_dns init-addr last,libc,none check inter 3s fall 3 rise 2


