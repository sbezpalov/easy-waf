
global
	log stdout format raw local0
	maxconn 50000
	stats socket testdata/golden/state/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	pidfile /run/haproxy.pid

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s

# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/
	use_backend bk_acme if acme


	acl redir_cust1_host hdr(host) -i custom.example.com


	http-request redirect scheme https code 301 if redir_cust1_host

	http-request redirect scheme https code 301

# ACME challenges served by easy-wafd local listener (see scripts / docs)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check


# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/app-custom-partial.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }

	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/minimal-spoe.cfg
	filter spoe engine crowdsec config testdata/golden/spoe/minimal-spoe.cfg

	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method

	# === Application: Custom (custom.example.com) ===
	acl app_cust1_host hdr(host) -i custom.example.com
	acl app_cust1_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_cust1_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_cust1_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_cust1_xss_path path -m reg -i (<script|javascript:)
	acl app_cust1_traversal path -m reg -i \.\./
	http-request deny deny_status 403 if app_cust1_host app_cust1_sqli
	http-request deny deny_status 403 if app_cust1_host app_cust1_sqli_path
	http-request deny deny_status 403 if app_cust1_host app_cust1_xss
	http-request deny deny_status 403 if app_cust1_host app_cust1_xss_path
	http-request deny deny_status 403 if app_cust1_host app_cust1_traversal
	http-request send-spoe-group crowdsec crowdsec-req if app_cust1_host


	use_backend bk_custom_example_com if app_cust1_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_custom_example_com
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	server s1 10.0.0.9:8080 check inter 3s fall 3 rise 2

