
global
	log stdout format raw local0
	maxconn 50000
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy.pid (see haproxy.service.d drop-in).

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/

	acl redir_fe_any_host hdr(host) -i waf-off.example.com
	http-request redirect scheme https code 301 if redir_fe_any_host !acme
	http-request redirect scheme https code 301 if !acme
	use_backend bk_acme if acme


# ACME challenges: easy-waf-api loopback serves Lego webroot (EASY_WAF_ACME_INTERNAL_HTTP, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check



# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/waf-rules-disabled.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }

	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/minimal-spoe.cfg
	filter spoe engine crowdsec config testdata/golden/spoe/minimal-spoe.cfg

	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method

	# === Application: WAF off (waf-off.example.com) ===
	acl app_w0_host hdr(host) -i waf-off.example.com
	acl app_w0_bm_0_trace method TRACE
	http-request deny deny_status 405 if app_w0_host app_w0_bm_0_trace
	acl app_w0_bm_1_connect method CONNECT
	http-request deny deny_status 405 if app_w0_host app_w0_bm_1_connect
	http-request deny deny_status 403 if app_w0_host { path_beg /.git }
	http-request deny deny_status 403 if app_w0_host { path_beg /.env }
	http-request deny deny_status 403 if app_w0_host { path_beg /.svn }
	http-request deny deny_status 403 if app_w0_host { path_beg /.hg }
	http-request deny deny_status 403 if app_w0_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_w0_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_w0_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_w0_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_w0_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_w0_host { path_beg /config }
	http-request deny deny_status 403 if app_w0_host { path_beg /backup.sql }
	http-request send-spoe-group crowdsec crowdsec-req if app_w0_host


	use_backend bk_waf_off_example_com if app_w0_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_waf_off_example_com
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_0
	server s1 10.0.0.1:8080 check inter 3s fall 3 rise 2

