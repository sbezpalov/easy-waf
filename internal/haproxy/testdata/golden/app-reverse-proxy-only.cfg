
global
	log stdout format raw local0
	maxconn 50000
	stats socket testdata/golden/state/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	pidfile /run/haproxy.pid

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s

# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/
	use_backend bk_acme if acme


	acl redir_dbg1_host hdr(host) -i debug.example.com


	http-request redirect scheme https code 301 if redir_dbg1_host

	http-request redirect scheme https code 301

# ACME challenges served by easy-wafd local listener (see scripts / docs)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check


# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/app-reverse-proxy-only.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }

	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method

	# === Application: Debug (debug.example.com) ===
	acl app_dbg1_host hdr(host) -i debug.example.com


	use_backend bk_debug_example_com if app_dbg1_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_debug_example_com
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	server s1 10.0.0.5:8080 check inter 3s fall 3 rise 2

