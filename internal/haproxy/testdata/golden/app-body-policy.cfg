
global
	log stdout format raw local0
	maxconn 50000
	# The stock haproxy.service starts as root; drop it after binding.
	user haproxy
	group haproxy
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy/haproxy.pid (see haproxy.service.d drop-in).
	# Mozilla "intermediate" without DHE: TLS 1.2 with ECDHE AEAD suites, and TLS 1.3.
	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	# httplog shows {host|rule}: the rule that refused a request (Logs → Blocked requests).
	declare capture request len 64
	declare capture request len 24
	http-request capture req.hdr(host) id 0
	acl acme path_beg /.well-known/acme-challenge/

	# HTTP app: PHP (php.example.local)
	acl http_app_bp1_host hdr(host) -i php.example.local

	# HTTP app: Uploads (up.example.local)
	acl http_app_bp2_host hdr(host) -i up.example.local

	# HTTP app: Open (open.example.local)
	acl http_app_bp3_host hdr(host) -i open.example.local


	# Universal blocks (plain HTTP vhosts; ACME excluded)
	acl p_http_git     path_beg /.git
	acl p_http_env     path_beg /.env
	http-request capture str(sensitive_path) id 1 if p_http_git !acme
	http-request deny deny_status 403 if p_http_git !acme
	http-request capture str(sensitive_path) id 1 if p_http_env !acme
	http-request deny deny_status 403 if p_http_env !acme
	acl http_bad_method method TRACE CONNECT
	http-request capture str(method) id 1 if http_bad_method !acme
	http-request deny deny_status 405 if http_bad_method !acme

# === Application: PHP (php.example.local) ===
	# Headers only: bodies are not inspected. req.hdr sees every value of a repeated
	# or comma-joined Content-Type. Status via return: deny_status has no 411 or 415.
	acl app_bp1_multipart req.hdr(content-type) -m beg -i multipart/
	http-request capture str(multipart) id 1 if http_app_bp1_host app_bp1_multipart !acme
	http-request return status 415 content-type text/plain string "multipart requests are blocked on this path" if http_app_bp1_host app_bp1_multipart !acme
	# HAProxy cannot count a streamed body, so one of undeclared length is refused.
	acl app_bp1_body_method method POST PUT PATCH
	http-request capture str(body_size) id 1 if http_app_bp1_host { req.hdr_val(content-length) gt 33554432 } !acme
	http-request return status 413 content-type text/plain string "request body too large" if http_app_bp1_host { req.hdr_val(content-length) gt 33554432 } !acme
	http-request capture str(content_length) id 1 if http_app_bp1_host { req.fhdr(transfer-encoding) -m found } !acme
	http-request return status 411 content-type text/plain string "Content-Length required" if http_app_bp1_host { req.fhdr(transfer-encoding) -m found } !acme
	http-request capture str(content_length) id 1 if http_app_bp1_host app_bp1_body_method !{ req.hdr(content-length) -m found } !acme
	http-request return status 411 content-type text/plain string "Content-Length required" if http_app_bp1_host app_bp1_body_method !{ req.hdr(content-length) -m found } !acme


# === Application: Uploads (up.example.local) ===
	# Headers only: bodies are not inspected. req.hdr sees every value of a repeated
	# or comma-joined Content-Type. Status via return: deny_status has no 411 or 415.
	acl app_bp2_multipart req.hdr(content-type) -m beg -i multipart/
	acl app_bp2_mp_allowed path -m str /upload
	acl app_bp2_mp_allowed path_beg /upload/
	acl app_bp2_mp_dots path -m reg -i (\.|%2e){2}
	http-request capture str(multipart) id 1 if http_app_bp2_host app_bp2_multipart !app_bp2_mp_allowed !acme
	http-request return status 415 content-type text/plain string "multipart requests are blocked on this path" if http_app_bp2_host app_bp2_multipart !app_bp2_mp_allowed !acme
	http-request capture str(multipart) id 1 if http_app_bp2_host app_bp2_multipart app_bp2_mp_dots !acme
	http-request return status 415 content-type text/plain string "multipart requests are blocked on this path" if http_app_bp2_host app_bp2_multipart app_bp2_mp_dots !acme
	# HAProxy cannot count a streamed body, so one of undeclared length is refused.
	acl app_bp2_body_method method POST PUT PATCH
	http-request capture str(body_size) id 1 if http_app_bp2_host { req.hdr_val(content-length) gt 1000 } !acme
	http-request return status 413 content-type text/plain string "request body too large" if http_app_bp2_host { req.hdr_val(content-length) gt 1000 } !acme
	http-request capture str(content_length) id 1 if http_app_bp2_host { req.fhdr(transfer-encoding) -m found } !acme
	http-request return status 411 content-type text/plain string "Content-Length required" if http_app_bp2_host { req.fhdr(transfer-encoding) -m found } !acme
	http-request capture str(content_length) id 1 if http_app_bp2_host app_bp2_body_method !{ req.hdr(content-length) -m found } !acme
	http-request return status 411 content-type text/plain string "Content-Length required" if http_app_bp2_host app_bp2_body_method !{ req.hdr(content-length) -m found } !acme


# === Application: Open (open.example.local) ===


	use_backend bk_acme if acme

	use_backend bk_php_example_local if http_app_bp1_host

	use_backend bk_up_example_local if http_app_bp2_host

	use_backend bk_open_example_local if http_app_bp3_host

	default_backend bk_http_default

# ACME challenges: easy-waf-api loopback serves Lego webroot (setting acme_internal_http, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check


# :80 catch-all when there is no fe_https (plain HTTP edge only)
backend bk_http_default
	mode http
	http-request deny deny_status 404





backend bk_php_example_local
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	server s1 192.168.1.60:80 check inter 3s fall 3 rise 2

backend bk_up_example_local
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	server s1 192.168.1.60:80 check inter 3s fall 3 rise 2

backend bk_open_example_local
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	server s1 192.168.1.60:80 check inter 3s fall 3 rise 2


