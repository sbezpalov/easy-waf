
global
	log stdout format raw local0
	maxconn 50000
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy.pid (see haproxy.service.d drop-in).

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/

	# HTTP app: Plain (plain.example.local)
	acl http_app_ho1_host hdr(host) -i plain.example.local


	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/minimal-spoe.cfg
	filter spoe engine crowdsec config testdata/golden/spoe/minimal-spoe.cfg

	# Universal blocks (plain HTTP vhosts; ACME excluded)
	acl p_http_git     path_beg /.git
	acl p_http_env     path_beg /.env
	http-request deny deny_status 403 if p_http_git !acme
	http-request deny deny_status 403 if p_http_env !acme
	acl http_bad_method method TRACE CONNECT
	http-request deny deny_status 405 if http_bad_method !acme

# === Application: Plain (plain.example.local) ===
	acl app_ho1_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_ho1_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_ho1_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_ho1_xss_path path -m reg -i (<script|javascript:)
	acl app_ho1_traversal path -m reg -i \.\./
	http-request deny deny_status 403 if http_app_ho1_host app_ho1_sqli !acme
	http-request deny deny_status 403 if http_app_ho1_host app_ho1_sqli_path !acme
	http-request deny deny_status 403 if http_app_ho1_host app_ho1_xss !acme
	http-request deny deny_status 403 if http_app_ho1_host app_ho1_xss_path !acme
	http-request deny deny_status 403 if http_app_ho1_host app_ho1_traversal !acme
	acl app_ho1_bm_0_trace method TRACE
	http-request deny deny_status 405 if http_app_ho1_host app_ho1_bm_0_trace !acme
	acl app_ho1_bm_1_connect method CONNECT
	http-request deny deny_status 405 if http_app_ho1_host app_ho1_bm_1_connect !acme
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /.git }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /.env }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /.svn }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /.hg }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /wp-admin }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /wp-login.php }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /config }
	http-request deny deny_status 403 if http_app_ho1_host !acme { path_beg /backup.sql }
	http-request send-spoe-group crowdsec crowdsec-req if http_app_ho1_host !acme


	use_backend bk_acme if acme

	use_backend bk_plain_example_local if http_app_ho1_host

	default_backend bk_http_default

# ACME challenges: easy-waf-api loopback serves Lego webroot (setting acme_internal_http, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check


# :80 catch-all when there is no fe_https (plain HTTP edge only)
backend bk_http_default
	mode http
	http-request deny deny_status 404





backend bk_plain_example_local
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_0
	server s1 192.168.1.50:80 check inter 3s fall 3 rise 2


