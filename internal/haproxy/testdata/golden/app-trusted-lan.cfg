
global
	log stdout format raw local0
	maxconn 50000
	# The stock haproxy.service starts as root; drop it after binding.
	user haproxy
	group haproxy
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy/haproxy.pid (see haproxy.service.d drop-in).
	# Mozilla "intermediate" without DHE: TLS 1.2 with ECDHE AEAD suites, and TLS 1.3.
	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s
	# Bodies of the responses HAProxy makes itself: denials, no server, timeouts.
	http-error status 400 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>400 Bad request</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>400 Bad request</h1><p>The request could not be understood.</p></main></body></html>"
	http-error status 401 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>401 Unauthorized</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>401 Unauthorized</h1><p>This address needs credentials the request did not carry.</p></main></body></html>"
	http-error status 403 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>403 Access denied</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>403 Access denied</h1><p>The request was refused by this site's security policy.</p></main></body></html>"
	http-error status 404 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>404 Not found</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>404 Not found</h1><p>Nothing is published at this address.</p></main></body></html>"
	http-error status 405 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>405 Method not allowed</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>405 Method not allowed</h1><p>This request method is not allowed here.</p></main></body></html>"
	http-error status 408 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>408 Request timeout</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>408 Request timeout</h1><p>The request took too long to arrive.</p></main></body></html>"
	http-error status 413 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>413 Request too large</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>413 Request too large</h1><p>The request body is larger than this site accepts.</p></main></body></html>"
	http-error status 429 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>429 Too many requests</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>429 Too many requests</h1><p>Too many requests from your address. Wait a moment and try again.</p></main></body></html>"
	http-error status 500 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>500 Internal error</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>500 Internal error</h1><p>Something went wrong while handling the request.</p></main></body></html>"
	http-error status 502 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>502 Bad gateway</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>502 Bad gateway</h1><p>The service behind this address sent an invalid response.</p></main></body></html>"
	http-error status 503 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>503 Service unavailable</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>503 Service unavailable</h1><p>The service behind this address is not available right now. Try again in a few minutes.</p></main></body></html>"
	http-error status 504 content-type "text/html; charset=utf-8" hdr Cache-Control no-store string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>504 Gateway timeout</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7;color:#1f2328}main{max-width:32rem;padding:2rem}h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#57606a;line-height:1.5;margin:0}</style></head><body><main><h1>504 Gateway timeout</h1><p>The service behind this address did not answer in time.</p></main></body></html>"


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	# httplog shows {host|rule}: the rule that refused a request (Logs → Blocked requests).
	declare capture request len 64
	declare capture request len 24
	http-request capture req.hdr(host) id 0
	acl acme path_beg /.well-known/acme-challenge/

	acl redir_fe_any_host hdr(host) -i trusted.example.com

	http-request redirect scheme https code 301 if redir_fe_any_host !acme
	http-request redirect scheme https code 301 if !acme

	use_backend bk_acme if acme


# ACME challenges: easy-waf-api loopback serves Lego webroot (setting acme_internal_http, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check

# CrowdSec SPOA bouncer. The name is fixed by use-backend in the vendor's SPOE file;
# the installer binds the bouncer to this loopback address.
backend crowdsec-spoa
	mode tcp
	timeout connect 2s
	timeout server 60s
	server spoa 127.0.0.1:9000



# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/app-trusted-lan.crt-list.txt alpn h2,http/1.1
	mode http
	# httplog shows {host|rule}: the rule that refused a request (Logs → Blocked requests).
	declare capture request len 64
	declare capture request len 24
	http-request capture req.hdr(host) id 0
	option forwardfor

	# CrowdSec SPOE — engine id must match the [section] in testdata/golden/spoe/crowdsec-vendor.cfg.
	# The bouncer's messages send unique-id, so the frontend must define one.
	unique-id-format %[uuid()]
	filter spoe engine crowdsec config testdata/golden/spoe/crowdsec-vendor.cfg

	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000" if { ssl_fc }
	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request capture str(sensitive_path) id 1 if p_git || p_env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request capture str(method) id 1 if bad_method
	http-request deny deny_status 405 if bad_method

	acl app_tl1_host hdr(host) -i trusted.example.com
# === Application: Trusted (trusted.example.com) ===
	# No body group: nothing here inspects bodies, so no request is buffered for it.
	# The bouncer answers in txn.crowdsec.remediation; without this deny its decisions do nothing.
	# When it cannot be reached the variable stays unset and traffic passes (fail open).
	http-request send-spoe-group crowdsec crowdsec-http-no-body if app_tl1_host
	http-request capture str(crowdsec) id 1 if app_tl1_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }
	# A page rather than a bare 403: the visitor learns why and what to send the owner.
	http-request return status 403 content-type "text/html; charset=utf-8" hdr Cache-Control no-store lf-string "<!doctype html><title>Access denied</title><h1>Access denied</h1><p>Your address %[src] is blocked on this site by CrowdSec, a shared reputation service. If this is a mistake, send this address to the site owner.</p>" if app_tl1_host { var(txn.crowdsec.remediation) -m found } !{ var(txn.crowdsec.remediation) -m str allow }



	use_backend bk_trusted_example_com if app_tl1_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_trusted_example_com
	mode http
	timeout connect 5s
	timeout server 120s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 400
	http-request deny deny_status 429 if rl_abuse_0
	server s1 10.0.0.3:80 check inter 3s fall 3 rise 2


