
global
	log stdout format raw local0
	maxconn 50000
	stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	pidfile /run/haproxy.pid

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s

# HTTP — ACME HTTP-01 + HTTPS redirect
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/
	use_backend bk_acme if acme
	http-request redirect scheme https code 301 unless acme

# ACME challenges served by easy-wafd local listener (see scripts / docs)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check

# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/app-with-restricted-path.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }
	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/minimal-spoe.cfg
	filter spoe engine crowdsec config testdata/golden/spoe/minimal-spoe.cfg
	# Universal blocks (all vhosts); per-app profile paths are scoped below
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method






	acl host_bk_ha_example_com hdr(host) -i ha.example.com

	acl bp_0_0 path_beg /.git
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_0

	acl bp_0_1 path_beg /.env
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_1

	acl bp_0_2 path_beg /.svn
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_2

	acl bp_0_3 path_beg /.hg
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_3

	acl bp_0_4 path_beg /wp-admin
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_4

	acl bp_0_5 path_beg /wp-login.php
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_5

	acl bp_0_6 path_beg /xmlrpc.php
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_6

	acl bp_0_7 path_beg /.well-known/security.txt
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_7

	acl bp_0_8 path_beg /vendor/phpunit
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_8

	acl bp_0_9 path_beg /config
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_9

	acl bp_0_10 path_beg /backup.sql
	http-request deny deny_status 403 if host_bk_ha_example_com bp_0_10


	acl bm_0_0_trace method TRACE
	http-request deny deny_status 405 if host_bk_ha_example_com bm_0_0_trace

	acl bm_0_1_connect method CONNECT
	http-request deny deny_status 405 if host_bk_ha_example_com bm_0_1_connect


	# Per-app restricted path: Home Assistant /api
	acl rp_0_0_rpath path_beg /api
	acl rp_0_0_rnet src 192.168.0.0/16 10.0.0.0/8
	http-request deny deny_status 403 if host_bk_ha_example_com rp_0_0_rpath !rp_0_0_rnet



	use_backend bk_ha_example_com if host_bk_ha_example_com

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404


backend bk_ha_example_com
	mode http
	timeout connect 5s
	timeout server 3600s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 80

	http-request deny deny_status 429 if rl_abuse_0

	timeout tunnel 3600s
	server s1 192.168.1.10:8123 check inter 3s fall 3 rise 2

