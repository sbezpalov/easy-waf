
global
	log stdout format raw local0
	maxconn 50000
	stats socket /run/haproxy/easy-waf-admin.sock mode 660 level admin
	stats timeout 30s
	# pidfile omitted: systemd supplies -p /run/haproxy.pid (see haproxy.service.d drop-in).

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s


# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
# Rule order: ACLs → all http-request → use_backend (avoids HAProxy 3.x "http-request after use_backend" warnings).
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/

	# HTTP app: HTTP (app-http.test)
	acl http_app_x2_host hdr(host) -i app-http.test

	# HTTP app: Both (app-both.test)
	acl http_app_x3_host hdr(host) -i app-both.test

	acl redir_fe_any_host hdr(host) -i app-https.test
	acl fe_http_keeps_plain hdr(host) -i app-http.test app-both.test
	http-request redirect scheme https code 301 if redir_fe_any_host !acme
	http-request redirect scheme https code 301 if !acme !fe_http_keeps_plain
	use_backend bk_acme if acme

	use_backend bk_app_http_test if http_app_x2_host

	use_backend bk_app_both_test if http_app_x3_host


# ACME challenges: easy-waf-api loopback serves Lego webroot (EASY_WAF_ACME_INTERNAL_HTTP, default 127.0.0.1:8089)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check



# HTTPS edge — one bind, many PEMs in crt-list → SNI picks cert; Host header routes to backends (single WAN IP).
frontend fe_https
	bind *:443 ssl crt-list testdata/golden/mixed-listen-modes.crt-list.txt alpn h2,http/1.1
	mode http
	option forwardfor
	http-request set-header X-Forwarded-Proto https
	http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains" if { ssl_fc }

	# CrowdSec SPOE — engine id must match spoe-agent section name in testdata/golden/spoe/minimal-spoe.cfg
	filter spoe engine crowdsec config testdata/golden/spoe/minimal-spoe.cfg

	# Universal blocks (all vhosts)
	acl p_git     path_beg /.git
	acl p_env     path_beg /.env
	http-request deny deny_status 403 if p_git || p_env
	acl bad_method method TRACE CONNECT
	http-request deny deny_status 405 if bad_method

	# === Application: HTTPS (app-https.test) ===
	acl app_x1_host hdr(host) -i app-https.test
	acl app_x1_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_x1_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_x1_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_x1_xss_path path -m reg -i (<script|javascript:)
	acl app_x1_traversal path -m reg -i \.\./
	http-request deny deny_status 403 if app_x1_host app_x1_sqli
	http-request deny deny_status 403 if app_x1_host app_x1_sqli_path
	http-request deny deny_status 403 if app_x1_host app_x1_xss
	http-request deny deny_status 403 if app_x1_host app_x1_xss_path
	http-request deny deny_status 403 if app_x1_host app_x1_traversal
	acl app_x1_bm_0_trace method TRACE
	http-request deny deny_status 405 if app_x1_host app_x1_bm_0_trace
	acl app_x1_bm_1_connect method CONNECT
	http-request deny deny_status 405 if app_x1_host app_x1_bm_1_connect
	http-request deny deny_status 403 if app_x1_host { path_beg /.git }
	http-request deny deny_status 403 if app_x1_host { path_beg /.env }
	http-request deny deny_status 403 if app_x1_host { path_beg /.svn }
	http-request deny deny_status 403 if app_x1_host { path_beg /.hg }
	http-request deny deny_status 403 if app_x1_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_x1_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_x1_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_x1_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_x1_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_x1_host { path_beg /config }
	http-request deny deny_status 403 if app_x1_host { path_beg /backup.sql }
	http-request send-spoe-group crowdsec crowdsec-req if app_x1_host

	# === Application: Both (app-both.test) ===
	acl app_x3_host hdr(host) -i app-both.test
	acl app_x3_sqli query -m reg -i (union\s+select|insert\s+into|drop\s+table|delete\s+from|update[^;]*set|;.*--)
	acl app_x3_sqli_path path -m reg -i (union\s+select|insert\s+into|drop\s+table|\.\./\.\.)
	acl app_x3_xss query -m reg -i (<script|javascript:|on(error|load|click|mouse)\s*=)
	acl app_x3_xss_path path -m reg -i (<script|javascript:)
	acl app_x3_traversal path -m reg -i \.\./
	http-request deny deny_status 403 if app_x3_host app_x3_sqli
	http-request deny deny_status 403 if app_x3_host app_x3_sqli_path
	http-request deny deny_status 403 if app_x3_host app_x3_xss
	http-request deny deny_status 403 if app_x3_host app_x3_xss_path
	http-request deny deny_status 403 if app_x3_host app_x3_traversal
	acl app_x3_bm_0_trace method TRACE
	http-request deny deny_status 405 if app_x3_host app_x3_bm_0_trace
	acl app_x3_bm_1_connect method CONNECT
	http-request deny deny_status 405 if app_x3_host app_x3_bm_1_connect
	http-request deny deny_status 403 if app_x3_host { path_beg /.git }
	http-request deny deny_status 403 if app_x3_host { path_beg /.env }
	http-request deny deny_status 403 if app_x3_host { path_beg /.svn }
	http-request deny deny_status 403 if app_x3_host { path_beg /.hg }
	http-request deny deny_status 403 if app_x3_host { path_beg /wp-admin }
	http-request deny deny_status 403 if app_x3_host { path_beg /wp-login.php }
	http-request deny deny_status 403 if app_x3_host { path_beg /xmlrpc.php }
	http-request deny deny_status 403 if app_x3_host { path_beg /.well-known/security.txt }
	http-request deny deny_status 403 if app_x3_host { path_beg /vendor/phpunit }
	http-request deny deny_status 403 if app_x3_host { path_beg /config }
	http-request deny deny_status 403 if app_x3_host { path_beg /backup.sql }
	http-request send-spoe-group crowdsec crowdsec-req if app_x3_host


	use_backend bk_app_https_test if app_x1_host

	use_backend bk_app_both_test if app_x3_host

	default_backend bk_not_found

backend bk_not_found
	mode http
	http-request deny deny_status 404



backend bk_app_https_test
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_0 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_0
	server s1 10.0.2.1:443 ssl verify none check inter 3s fall 3 rise 2

backend bk_app_http_test
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_1 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_1
	server s1 10.0.2.2:80 check inter 3s fall 3 rise 2

backend bk_app_both_test
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	stick-table type ip size 200k expire 5m store http_req_rate(10s)
	http-request track-sc0 src
	acl rl_abuse_2 sc0_http_req_rate gt 100
	http-request deny deny_status 429 if rl_abuse_2
	server s1 10.0.2.3:8080 check inter 3s fall 3 rise 2

