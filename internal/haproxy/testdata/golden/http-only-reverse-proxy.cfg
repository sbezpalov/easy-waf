
global
	log stdout format raw local0
	maxconn 50000
	stats socket testdata/golden/state/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	pidfile /run/haproxy.pid

defaults
	log	global
	mode	http
	option	dontlognull
	option	httplog
	option	http-server-close
	option	forwardfor except 127.0.0.0/8
	timeout connect 5s
	timeout client  50s
	timeout server  50s
	timeout tunnel  3600s

# HTTP — ACME HTTP-01, per-app plain HTTP, per-host HTTPS redirects, default redirect
frontend fe_http
	bind *:80
	mode http
	acl acme path_beg /.well-known/acme-challenge/
	use_backend bk_acme if acme

	# HTTP app: IoT (iot.lan)
	acl http_app_ior1_host hdr(host) -i iot.lan
	use_backend bk_iot_lan if http_app_ior1_host



	default_backend bk_http_default

# ACME challenges served by easy-wafd local listener (see scripts / docs)
backend bk_acme
	mode http
	server acme 127.0.0.1:8089 check


# :80 catch-all when there is no fe_https (plain HTTP edge only)
backend bk_http_default
	mode http
	http-request deny deny_status 404





backend bk_iot_lan
	mode http
	timeout connect 5s
	timeout server 50s
	option http-keep-alive
	server s1 192.168.55.1:80 check inter 3s fall 3 rise 2

