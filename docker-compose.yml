# Development / lab stack (Linux). Do not use default passwords in production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easywaf
      POSTGRES_PASSWORD: easywaf
      POSTGRES_DB: easywaf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easywaf -d easywaf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
